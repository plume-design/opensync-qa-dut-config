# Exact model name (case-sensitive!)
model_string: FILOGIC880-BE19000
# Does OpenSync control the WAN interface (formerly: DUT Type: extender/residential_gateway)?
wan_link_selection: true
# Username for device management SSH access (null if not supported)
username: osync
# Password for device management SSH access (null if not supported)
password: osync123
# Possible options for features
# * DFS: If Dynamic Frequency Selection (DFS) is supported
# * FULL_CONTROL: If controller is fully managing Home VAPs
# * FAN: If device has a fan for active cooling
# * REGION_CHANGE: If device is able to change the regulatory domain
# * FLEX: If device supports FLEX
# * EAA: : If device supports Energy Aware Adapt
# * WAG: If device supports Wireless Access Gateway
# * WPD: device is running Watchdog Proxy Daemon
# * WDS: Wireless Distribution System - Uses the MultiAP 802.11 Wi-Fi frame instead of GRE encapsulation for backhaul communication
# * LED_STATE: If LED state is being reported in device stats
# * DNS_FAILOVER: if device can handle non-working DNS servers received via DHCP config
# * ADV_ETH_CLIENT_DET: If eth clients are being ARP-ed
# * FLEX_IPV6_PHASE_I: If device supports IPv6 Flex tunnel endpoint
# * FLEX_IPV6_PHASE_II: If device supports IPv6 internet access over Flex tunnel
# * LAN_LATENCY: If device supports Lan Latency
# * HOTSPOT_20: If device supports HotSpot 2.0
# * PROXIMITY: If device supports PROXIMITY
# * LTE: If device supports backup uplink over LTE
# * PoE: If device can be powered over Ethernet
# * RBUS: If device supports OpenSync BUS using rbus (OFR-5119)
# * FAST_ROAMING: If device supports FAST_ROAMING
# * TOPOLOGY_SNAPSHOT: If device supports TOPOLOGY_SNAPSHOT
# * UBUS: If device supports OpenSync BUS using ubus (OFR-5119)
# * REVSSH: If device supports reverse SSH (OFR-218)
# * RADAR_CHANNEL_STATES: If device supports interpreting channel states for radar events
# * RADAR_DISRUPTIONS: If device supports reducing RADAR_DISRUPTIONS
# * MLO_FH: If device supports MLO on the fronthaul only
# * MLO_BH: If the device supports MLO backhaul
# * SKIPACCEL: If device supports SKIPLOG or skipaccel NF target
# * MCAST_ACCEL: If device supports multicast traffic acceleration
# * TX_POWER_CONFIGURABLE: If device supports configuring radio transmission power via ovsdb
features:
  RADAR_DISRUPTIONS: {min_fw: 6.6.0-0, eos_fw: null}
  WAG: {min_fw: 6.5.0-0, eos_fw: null}
  DFS: {}
  FULL_CONTROL: {}
  REVSSH: {}
  UBUS: {}
  DNS_FAILOVER: {}
  # MLO_FH: {min_fw: 6.5.1-0, eos_fw: null}  # Device MLO implementation incompatible with current framework
  MCAST_ACCEL: {min_fw: 6.6.0-0, eos_fw: null}
# Supported security modes
security: [OPEN, WPA2, WPA3]
# Default regulatory domain
regulatory_domain: US
# Location of SSL certificates
cert_dir_path: /var/certs/
# Location for firmware upgrade images
fw_download_path: /tmp/firmware
# OpenSync home directory
opensync_rootdir: &opensync_rootdir /usr/opensync
# Append the following locations to the default system PATH
shell_path: /bin:/sbin:/usr/bin:/usr/sbin:/usr/opensync/tools
# Command for reading system logs (including any parameters, e.g. "cat /var/log/messages")
logread: logread
# 'logread method' for FRV. Available options: logread_v1, logread_v2 (json), logread_v3 (cat <file_name>)
frv_logread: logread_v3
# WiFi chip vendor (a.k.a. device family). Supported options: qca, bcm, mtk, rdk
wifi_vendor: mtk
